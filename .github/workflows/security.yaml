name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  # Allow the release workflow (tag-and-release.yaml) to reuse this entire
  # pipeline via `uses: ./.github/workflows/security.yaml`. Keeps the security
  # gate definition in one place — adding a scanner here automatically gates
  # releases as well.
  workflow_call:

# When invoked directly (push/PR/schedule), cancel earlier in-flight runs on
# the same ref to save CI minutes. When invoked as a workflow_call (from
# tag-and-release.yaml), use a unique group keyed on the calling workflow so
# the standalone run does NOT cancel the reusable invocation (or vice versa).
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: |
          bandit -r custom_components/v2c_cloud/ \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r custom_components/v2c_cloud/ \
            --severity-level medium \
            --confidence-level medium

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --format=columns --strict

      # Test dependencies are NOT shipped to users: the integration declares
      # `"requirements": []` in manifest.json — aiohttp is provided by Home
      # Assistant core at runtime, not by this package. Even so, the test-deps
      # audit runs --strict with ZERO ignores, same as the runtime audit above.
      #
      # History: from 1.3.2 to 1.4.0 this step carried a growing --ignore-vuln
      # list (14 aiohttp advisories by 2026-09-08, the last one high severity)
      # because aiohttp was held at <3.14 for the test harness: aiohttp 3.14
      # made `ClientResponse.__init__` require a keyword-only `stream_writer`
      # that aioresponses never passes. That is now handled by
      # `tests/conftest.py::_install_aioresponses_compat`, so aiohttp is pinned
      # >=3.14.3 and every one of those advisories is genuinely resolved rather
      # than suppressed. Do not reintroduce ignores here: if a new advisory
      # lands, bump the pin.
      - name: Audit test dependencies
        run: pip-audit -r requirements_test.txt --format=columns --strict

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
